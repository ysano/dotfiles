name: shell-tests

on:
  push:
    paths: [ 'bin/**', 'test_*.sh', '.claude/statusline-command.sh', 'link.sh' ]
  pull_request:
    paths: [ 'bin/**', 'test_*.sh', '.claude/statusline-command.sh', 'link.sh' ]

jobs:
  emoji-id:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: bash test_emoji_id.sh

  statusline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: bash test_statusline.sh

  link:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y zsh
    - run: bash test_link.sh
