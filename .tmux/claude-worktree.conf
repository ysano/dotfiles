# =============================================================================
# エージェント/worktree ツリー
# prefix + w で現在の tmux session の一覧を開く。l キーで旧ランチャーへ。
# Python がない環境では既存ランチャーを継続使用する。
# =============================================================================
# run-shellで起動元のclient/session/paneをformat展開してからpopupへ渡す。
# → 現在 Claude Code を動かしているリポジトリを軸に worktree を作る
bind-key w run-shell "~/.tmux/agents/dashboard_popup.sh '#{session_id}' '#{pane_id}' '#{client_tty}'"
