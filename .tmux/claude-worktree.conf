# =============================================================================
# エージェント/worktree ツリー
# prefix + w で現在の tmux session の一覧を開く。l キーで旧ランチャーへ。
# Python がない環境では既存ランチャーを継続使用する。
# =============================================================================
# -d で popup の cwd をキー押下時の pane のパスにする
# → 現在 Claude Code を動かしているリポジトリを軸に worktree を作る
bind-key w display-popup -E -w 90% -h 80% -d "#{pane_current_path}" "if command -v python3 >/dev/null 2>&1; then python3 ~/.tmux/agents/dashboard.py --session '#{session_id}' --pane '#{pane_id}'; else ~/.tmux/claude/worktree_launch.sh popup; fi"
