# =================================================================
# tmux resurrect + continuum プラグイン設定
# =================================================================

# === TPM（Tmux Plugin Manager）プラグイン定義 ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# === tmux-resurrect 基本設定 ===

# 復元対象プログラムの拡張（デフォルトに追加）
set -g @resurrect-processes 'vi vim nvim emacs man less more tail top htop python python3 node npm ssh psql mysql sqlite3 redis-cli mongosh'

# ペイン内容の復元（実験的機能、デフォルトOFF）
# 有効化すると各ペインの内容も復元されますが、パフォーマンスに影響する可能性があります
# set -g @resurrect-capture-pane-contents 'on'

# 保存戦略（pane内容を含める場合のみ有効）
# set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-strategy-nvim 'session'

# 保存ディレクトリ（デフォルト: ~/.local/share/tmux-resurrect/）
# カスタマイズする場合は以下をアンコメント:
# set -g @resurrect-dir '~/.tmux/resurrect'

# === tmux-continuum 自動化設定 ===

# 自動保存間隔（分単位）
set -g @continuum-save-interval '15'

# tmux起動時に前回のセッションを自動復元
set -g @continuum-restore 'on'

# システム起動時にtmuxを自動起動（デフォルトOFF、必要に応じて有効化）
# macOS: launchd、Linux: systemd での自動起動
# set -g @continuum-boot 'on'
# set -g @continuum-boot-options 'fullscreen'

# === status-right統合設定 ===
# エージェント監視/現在sessionの件数 + continuum保存 + システムメトリクス + 時刻
# system_metrics.sh がOS検出+メトリクス取得を集約（クォーティング問題を回避）

set -g status-right-length 150
set -g status-right "#[fg=yellow,bold]#(~/.tmux/scripts/system_metrics.sh)#[default] #(if command -v python3 >/dev/null 2>&1; then python3 ~/.tmux/agents/registry.py poll 2>/dev/null; else ~/.tmux/claude/polling_monitor.sh; fi)#{@agent_summary} #{continuum_status} #[fg=cyan,bold]%Y-%m-%d %H:%M#[default] "

# continuum statusのカスタマイズ
set -g @continuum-status-icon-ok "💾"
set -g @continuum-status-icon-saving "⏳"
set -g @continuum-status-icon-disabled "🚫"

# === デバッグ情報 ===
if-shell '[ "${TMUX_DEBUG_MODE:-false}" = "true" ]' \
  'display-message "tmux resurrect + continuum プラグイン設定読み込み完了"'
