# Keybinding settings

# Emacs-style keybindings for copy mode
set-window-option -g mode-keys emacs

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Toggle mouse (for native terminal text selection)
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# Split with current directory
bind -T emacsCX 2 split-window -v -c "#{pane_current_path}"
bind -T emacsCX 3 split-window -h -c "#{pane_current_path}"

# Custom key table for Emacs-like bindings
bind x switch-client -T emacsCX

# Emacs C-x key bindings
bind -T emacsCX 0 kill-pane
bind -T emacsCX 1 break-pane
bind -T emacsCX o select-pane -t :.+
bind -T emacsCX k kill-pane
bind -T emacsCX i display-panes

# Alt+N で Window N に切り替え
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Window reorder (Alt+Shift+Left/Right)
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Pane resize with repeat (-r)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# ファイルパスのプレビュー（Option + クリック → ポップアップ。e: Emacs / o: 既定アプリ /
# c: Claude Code の入力欄へ渡す。Markdown を含むディレクトリは glow の一覧で開く）
# OSC 8 のリンクがあれば優先し、無ければクリック位置の行からパスを切り出して
# pane の cwd → git ルートの順に解決する（scripts/open-path.sh）。
# コミットの SHA は差分、PR / Issue（#番号・owner/repo#番号・URL）は gh で本文を開く。
# GitHub 以外の URL はプレビューできないので、ブラウザで開く。
# 省略形（bp#番号 等）は ~/.tmux.conf.local に set -g @open_path_gh_alias "bp=owner/repo ..." で登録する。
# 既定の MouseDown1Pane と同じくクリックした pane を選択する。修飾キー付きの明示的な操作
# なので、マウスを使うアプリ（fullscreen の Claude Code、emacs -nw 等）の中でも tmux が
# 処理する（右クリックメニューも open-path-menu.sh で同様にする）。C-MouseDown1Pane は tmux 既定
# （swap-pane）のまま残す。画面上の文字列はシェルを通さないよう set -gF で渡す。
bind -n M-MouseDown1Pane {
  select-pane -t =
  set -gF @open_path_client '#{client_name}'
  set -gF @open_path_link '#{mouse_hyperlink}'
  set -gF @open_path_line '#{mouse_line}'
  set -gF @open_path_x '#{mouse_x}'
  set -gF @open_path_y '#{mouse_y}'
  set -gF @open_path_pane '#{pane_id}'
  set -gF @open_path_cwd '#{pane_current_path}'
  run-shell -b '~/.tmux/scripts/open-path.sh click'
}

# 普通のクリック: URL・PR / Issue（#番号・owner/repo#番号・省略形）の上なら、ブラウザで
# 開く（scripts/open-path.sh click link。それ以外の場所では何もしない）。
# - 1 回目の押下を離して 0.35 秒待ち、その間に次の押下が無かった時だけ開く。tmux は 300ms
#   以内の 2 回目・3 回目の押下を SecondClick / TripleClick にし、ダブルクリック（単語の
#   コピー）を後から DoubleClick として出すため、離した時点ではまだ 1 回のクリックか分からない。
#   押下ごとに @open_path_seq を進め、@open_path_press に何回目の押下かを残す
#   （MouseDown1Pane は tmux 既定の select-pane・send-keys -M に足す。SecondClick1Pane は
#   既定で割り当てが無く pane へ渡るため、send-keys -M で同じく渡す）。@open_path_press は
#   離すたびに 0 に戻す。押した位置（@open_path_down = pane:x:y）と離した位置が同じ時だけ
#   クリックとみなす（動けばドラッグになるため、ドラッグの後や pane の外で押した時は開かない）
# - クリックした位置は Option + クリック・右クリックと別の @open_path_up_* に残す（待つ間に
#   それらが共通の @open_path_* を書き換えても混ざらない）。
# - ドラッグの範囲選択はコピーモードの MouseDragEnd1Pane で終わるため、ここには来ない。
# - マウスを使うアプリ（codex、fullscreen の Claude Code 等）とコピーモードへは、割り当てが
#   無かったときと同じくそのまま渡す。
# - クリックのたびにシェルを起動しないよう、OSC 8 のリンクか、行に :// か #数字 がある
#   時だけ起動する（tmux の書式では # を [#] と書く）。
bind -n MouseDown1Pane {
  select-pane -t =
  send-keys -M
  set -g @open_path_press 1
  set -gF @open_path_down '#{pane_id}:#{mouse_x}:#{mouse_y}'
  set -gF @open_path_seq '#{e|+:#{@open_path_seq},1}'
}
bind -n SecondClick1Pane {
  send-keys -M
  set -g @open_path_press 2
  set -gF @open_path_seq '#{e|+:#{@open_path_seq},1}'
}
bind -n MouseUp1Pane {
  if -F '#{||:#{mouse_any_flag},#{pane_in_mode}}' {
    send-keys -M
    set -g @open_path_press 0
  } {
    if -F '#{&&:#{==:#{@open_path_press},1},#{&&:#{==:#{@open_path_down},#{pane_id}:#{mouse_x}:#{mouse_y}},#{||:#{mouse_hyperlink},#{m/r:(://|[#][0-9]),#{mouse_line}}}}}' {
      set -gF @open_path_up_client '#{client_name}'
      set -gF @open_path_up_link '#{mouse_hyperlink}'
      set -gF @open_path_up_line '#{mouse_line}'
      set -gF @open_path_up_x '#{mouse_x}'
      set -gF @open_path_up_y '#{mouse_y}'
      set -gF @open_path_up_pane '#{pane_id}'
      set -gF @open_path_up_cwd '#{pane_current_path}'
      run-shell -b -d 0.35 '~/.tmux/scripts/open-path.sh click link #{@open_path_seq}'
      set -g @open_path_press 0
    } {
      set -g @open_path_press 0
    }
  }
}

# 右クリックメニューにも「Preview Path」（キー o）を足す。tmux 既定のメニューを素の
# tmux から取り出して項目を差し込み、割り当て直す（scripts/open-path-menu.sh）。
run-shell -b '~/.tmux/scripts/open-path-menu.sh install'
