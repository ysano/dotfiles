# pane を開く・閉じるたびに、分割ごとの大きさを均等にそろえる（Emacs の balance-windows）。
# 手で変えた大きさも次の開閉でそろうため、保ちたいときは無効にする:
#   set -g @pane_auto_balance off
# C-x + は無効にしていても、その場でそろえる
bind -T emacsCX + run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'

set-hook -g after-split-window {
  if -F '#{!=:#{@pane_auto_balance},off}' {
    run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
  }
}
set-hook -g after-kill-pane {
  if -F '#{!=:#{@pane_auto_balance},off}' {
    run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
  }
}
set-hook -g pane-exited {
  if -F '#{!=:#{@pane_auto_balance},off}' {
    run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
  }
}
