# pane を開く・閉じるたびに、分割ごとの大きさを均等にそろえる（Emacs の balance-windows）。
# 手で変えた大きさも次の開閉でそろうため、保ちたいときは無効にする:
#   set -g @pane_auto_balance off
# C-x + は無効にしていても、その場でそろえる
bind -T emacsCX + run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
# prefix M-8: tiled（M-5）より列を増やした碁盤目。1 枚の幅が @layout_grid_min_width（既定 90）
# を下回らない範囲で列を最大にする（ワイド画面で横長になりすぎない）
bind M-8 run-shell '~/.tmux/scripts/balance-panes.sh grid #{window_id}'
# prefix M-4 / M-7: main pane（番号が最小）が左 / 右の半分を占め、残りをもう半分に M-8 と同じ
# 最小幅で碁盤目にする。半分に 2 列取れない画面や pane が 4 枚以下なら、残りは 1 列に積む。
# tmux 3.8 より前の M-7 は、main を右に置けないため既定の main-vertical-mirrored になる
bind M-4 run-shell '~/.tmux/scripts/balance-panes.sh main #{window_id}'
bind M-7 run-shell '~/.tmux/scripts/balance-panes.sh main-mirrored #{window_id}'
# prefix Space の巡回で選ぶ tmux 既定の main-vertical も、縦の区切りを中央にする
# （既定は main pane が 80 桁で、ワイド画面では残りの列が広すぎる）
set -gw main-pane-width 50%

set-hook -g after-split-window {
  if -F '#{!=:#{@pane_auto_balance},off}' {
    run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
  }
}
set-hook -g after-kill-pane {
  if -F '#{!=:#{@pane_auto_balance},off}' {
    run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
  }
}
set-hook -g pane-exited {
  if -F '#{!=:#{@pane_auto_balance},off}' {
    run-shell '~/.tmux/scripts/balance-panes.sh #{window_id}'
  }
}
